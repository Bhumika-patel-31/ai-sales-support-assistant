<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Sales Assistant</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-color: #f3f4f6;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-2xl bg-white shadow-lg rounded-xl p-6">

        <!-- Header -->
        <div class="flex items-center gap-2 mb-4">
            <div class="w-3 h-3 bg-green-500 rounded-full"></div>
            <h1 class="text-lg font-semibold">AI Sales Assistant</h1>
        </div>

        <!-- Chat Response -->
        <div id="chat-response" class="mb-4"></div>

        <!-- Recommendations -->
        <div id="recommendation-section" class="mb-4"></div>

        <!-- Input -->
        <div class="flex gap-2">
            <input id="chat-input" type="text" placeholder="Ask something like: I want shoes for gym"
                class="flex-1 border p-2 rounded-lg" />
            <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 rounded-lg">
                Send
            </button>
        </div>

    </div>

    <!-- JS -->
    <script>
        async function sendMessage() {
            const input = document.getElementById("chat-input");
            const message = input.value;

            if (!message) return;

            const res = await fetch("http://127.0.0.1:8000/chat/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message })
            });

            const data = await res.json();

            // ✅ AI Response (clean)
            document.getElementById("chat-response").innerHTML = `
        <div class="bg-gray-100 p-4 rounded-lg shadow">
          ${data.response}
        </div>
      `;

            // ✅ Recommendations BELOW response
            const recDiv = document.getElementById("recommendation-section");

            if (data.recommendations && data.recommendations.length > 0) {
                recDiv.innerHTML = `
          <h3 class="font-semibold mt-3 mb-2">Recommended Products</h3>
          <div class="grid grid-cols-2 gap-3">
            ${data.recommendations.map(r => `
              <div class="border p-3 rounded-lg shadow-sm">
                <p class="font-medium">${r.name}</p>
                <p class="text-sm text-gray-500">${r.price}</p>
              </div>
            `).join("")}
          </div>
        `;
            } else {
                recDiv.innerHTML = `
          <p class="text-sm text-gray-400">No recommendations found</p>
        `;
            }

            input.value = "";
        }
    </script>

</body>

</html>
